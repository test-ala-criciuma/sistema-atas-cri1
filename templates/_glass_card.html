{% macro glass_card(icon_html='', icon_classes='', title='', subtitle='', href=None, inner_html='', extra_classes='') %}
<div class="glass-card p-4 {{ extra_classes }} transform transition hover:scale-105">
  <a href="{{ href if href else 'javascript:void(0)' }}" class="group block sm:flex sm:items-start sm:gap-4 text-inherit no-underline">
    <div class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 {{ icon_classes }} text-xl sm:text-2xl shadow-md mr-3" aria-hidden="true">
      {{ icon_html|safe }}
    </div>
    <div class="mt-1 sm:mt-0">
      <div class="text-base sm:text-lg font-semibold text-slate-50">{{ title }}</div>
      {% if subtitle %}<div class="text-xs sm:text-sm text-purple-200/70 mt-1">{{ subtitle }}</div>{% endif %}
      {% if inner_html %}<div class="mt-3">{{ inner_html|safe }}</div>{% endif %}
    </div>
  </a>
</div>
{% endmacro %}
