<style>
  /* Central glass primitives (enhanced per design guidelines) */
  .glass-body{
    background: rgba(255,255,255,0.06); /* soft white translucent */
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px;
    padding: 1rem;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .glass-card{
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 20px;
    padding: 1rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    transition: transform .15s ease, box-shadow .18s ease;
  }

  .glass-card:hover{ transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.50); }

  .glass-input{
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 0.6rem 1rem;
    border-radius: 50px; /* pill */
    color: inherit;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 6px 18px rgba(0,0,0,0.28);
    transition: box-shadow .12s ease, border-color .12s ease;
  }
  .glass-input:focus{ outline:none; box-shadow: 0 0 0 6px rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.7); }

  .glass-hint{ color: rgba(226,226,230,0.55); font-size:0.875rem; }
  .glass-actions a, .glass-actions button{ display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; }

  .section-content input[type="text"], .discursante-field input, .sidebar-section input[type="text"], input[type="date"], select { background: rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.08); padding:0.6rem 1rem; border-radius:50px; color:inherit; }

  /* Darken select dropdown options (works on most browsers) and ensure select can layer above other elements */
  select.glass-input{ color: #e6e1f5; background: rgba(255,255,255,0.045); position: relative; z-index: 60; }
  select.glass-input option, select.glass-input optgroup{ background: #0f0514; color: #e6e1f5; }
  select.glass-input:focus{ box-shadow: 0 0 0 6px rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.7); outline: none; }
</style>
